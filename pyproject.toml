[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "Orquestador hibrido Claude Code (arquitecto/reviewer) + DeepSeek (workers)"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pydantic",
    "httpx",
    "pyyaml",
    "rich",
    "psutil",
]

[project.scripts]
agents = "orchestrator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

# las skills viajan dentro del paquete para que `agents skills` funcione tras pipx install
[tool.hatch.build.targets.wheel.force-include]
"claude/skills" = "orchestrator/skills"
