name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: git config --global user.email test@ci.local && git config --global user.name test
      - run: pip install -e ".[dev]"
      - run: pytest -q
